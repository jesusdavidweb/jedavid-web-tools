name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable

      # 1. Manifest validation. The plugin and MCP manifests must parse as JSON
      #    and reference files that actually exist in the repo.
      - name: Validate manifests
        run: |
          node -e "const fs=require('fs'); ['plugin.json','mcp.json','package.json','tsconfig.base.json','pnpm-workspace.yaml'].forEach(f => JSON.parse(fs.readFileSync(f, 'utf8')))"
          node -e "const p=require('./plugin.json'); const m=require('./mcp.json'); if(!p.name||!p.version) throw new Error('plugin.json missing name/version'); for(const [name,cfg] of Object.entries(m.mcpServers||{})){ if(!cfg.command||!cfg.args) throw new Error('mcp server '+name+' missing command/args'); }"
          test -x bin/jedavid-web-tools-mcp.mjs

      # 2. Portable MCP smoke test. The runtime must start without pnpm install
      #    and answer tools/list, server/discover and unknown-tool correctly.
      - name: Portable MCP smoke test
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' | node bin/jedavid-web-tools-mcp.mjs | grep -q 'site_audit'
          printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"server/discover","params":{}}' | node bin/jedavid-web-tools-mcp.mjs | grep -q '2026-07-28'
          printf '%s\n' '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"unknown","arguments":{}}}' | node bin/jedavid-web-tools-mcp.mjs | grep -q 'Unknown tool'
          printf '%s\n' '{"jsonrpc":"2.0","id":4,"method":"http_inspect","params":{}}' | node bin/jedavid-web-tools-mcp.mjs | grep -q 'Method not found'

      # 3. Install dev dependencies and build everything.
      - name: Install
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Build core types
        run: pnpm --filter @jedavid/web-tools-core build
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

      # 4. Test suite. The full unit + integration test suite must pass.
      - name: Run tests
        run: pnpm test

      # 5. Skills sanity. Every Skill must declare name and description.
      #    The Agent Skills spec requires that the YAML frontmatter parse as
      #    plain scalars: ": " and " #" sequences inside a value are
      #    ambiguous with key/value separators or comments and would cause
      #    the skill to be silently skipped by conformant clients.
      - name: Validate skills
        run: |
          node -e "
            const fs = require('node:fs');
            const path = require('node:path');
            const dirs = fs.readdirSync('skills');
            let ok = true;
            for (const d of dirs) {
              const file = path.join('skills', d, 'SKILL.md');
              if (!fs.existsSync(file)) { console.log('missing', file); ok = false; continue; }
              const content = fs.readFileSync(file, 'utf8');
              const m = content.match(/^---\n([\s\S]*?)\n---\n/);
              if (!m) { console.log(file, 'no frontmatter'); ok = false; continue; }
              const fm = {};
              for (const line of m[1].split('\n')) {
                const i = line.indexOf(':');
                if (i < 0) continue;
                fm[line.slice(0, i).trim()] = line.slice(i + 1).trim();
              }
              if (!fm.name) { console.log(file, 'missing name'); ok = false; }
              if (!fm.description) { console.log(file, 'missing description'); ok = false; }
              if (fm.name !== d) { console.log(file, 'name != dir', fm.name, d); ok = false; }
              if (fm.name && !/^[a-z0-9-]+$/.test(fm.name)) { console.log(file, 'name has invalid chars'); ok = false; }
              if (fm.name && (fm.name.startsWith('-') || fm.name.endsWith('-'))) { console.log(file, 'name starts/ends with hyphen'); ok = false; }
              if (fm.name && /--/.test(fm.name)) { console.log(file, 'name has consecutive hyphens'); ok = false; }
              if (fm.name && fm.name.length > 64) { console.log(file, 'name too long'); ok = false; }
              if (fm.description && fm.description.length > 1024) { console.log(file, 'description too long'); ok = false; }
              for (const k of ['name', 'description']) {
                if (fm[k] && /: /.test(fm[k])) { console.log(file, k, 'contains \": \" (breaks plain-scalar YAML)'); ok = false; }
                if (fm[k] && / #/.test(fm[k])) { console.log(file, k, 'contains \" #\" (breaks plain-scalar YAML)'); ok = false; }
              }
            }
            if (!ok) process.exit(1);
          "
